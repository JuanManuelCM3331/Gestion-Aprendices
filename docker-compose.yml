services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      APP_NAME: "SGA - Gestion de Aprendices"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-gestion_aprendices}
      DB_USERNAME: ${DB_USERNAME:-sga_user}
      DB_PASSWORD: ${DB_PASSWORD:-sga_secret}
      SESSION_DRIVER: file
      CACHE_STORE: file
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/var/www/html
    networks:
      - app_network

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_DATABASE:-gestion_aprendices}
      MYSQL_USER: ${DB_USERNAME:-sga_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-sga_secret}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - app_network

volumes:
  db_data:

networks:
  app_network:
    driver: bridge
