name: Validacion inicial

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Listar archivos del proyecto
        run: ls -la

      - name: Verificar que existan archivos clave de Laravel y Docker
        run: |
          test -f README.md
          test -f Dockerfile
          test -f docker-compose.yml
          test -f artisan
          test -d app/Models
          test -d app/Services
          test -d app/Repositories

      - name: Confirmar validacion
        run: echo "Validacion de arquitectura Laravel MVC + Capas ejecutada correctamente"
